name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift build (SwiftPM smoke + .app bundle)
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: SwiftPM build (smoke)
        run: swift build
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build .app bundle
        run: |
          xcodebuild \
            -project Speedy.xcodeproj \
            -scheme Speedy \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify bundle layout
        run: |
          APP="build/Build/Products/Debug/Speedy.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "missing Info.plist"; exit 1; }
          test -x "$APP/Contents/MacOS/Speedy" || { echo "missing executable"; exit 1; }

  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: speedy
          POSTGRES_PASSWORD: speedy
          POSTGRES_DB: speedy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speedy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://speedy:speedy@localhost:5432/speedy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q

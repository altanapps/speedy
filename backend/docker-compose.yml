services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: speedy
      POSTGRES_PASSWORD: speedy
      POSTGRES_DB: speedy
    ports:
      - "5432:5432"
    volumes:
      - speedy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  speedy_pg:

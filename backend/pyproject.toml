[project]
name = "speedy-backend"
version = "0.1.0"
description = "Speedy retrieval + execution backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "alembic>=1.13",
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.40",
    "py-clob-client>=0.21",
    "web3>=6.20",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
speedy-refresh = "app.refresh:_cli"
speedy-keys = "app.keys_cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
